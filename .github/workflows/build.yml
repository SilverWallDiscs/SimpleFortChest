name: Build SimpleFortChest

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 app
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run probability tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name SimpleFortChest --collect-all PySide6 --collect-all pynput --hidden-import=pynput.keyboard._win32 app.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/SimpleFortChest.exe package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath SimpleFortChest-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFortChest-Windows-x64
          path: SimpleFortChest-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: SimpleFortChest-Windows-x64.zip
